[package]
name = "coffer-server"
description = "coffer server: configuration, secrets, passkey identity and token handling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "coffer"
path = "src/main.rs"

[features]
# Build OpenSSL from source and link it statically, so the container image
# needs no system libssl (webauthn-rs links OpenSSL).
vendored-openssl = ["dep:openssl", "openssl/vendored"]
# Test helpers (temporary server, manual clock, soft passkeys) for this
# crate's integration tests. Never part of a release build.
testkit = [
    "coffer-domain/testkit",
    "coffer-store/testkit",
    "dep:http-body-util",
    "dep:tower",
    "dep:webauthn-authenticator-rs",
]

[dependencies]
axum.workspace = true
base64.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
coffer-domain = { workspace = true, features = ["openapi"] }
coffer-store.workspace = true
getrandom.workspace = true
http.workspace = true
jiff = { workspace = true, features = ["serde"] }
maud.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_urlencoded.workspace = true
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
webauthn-rs.workspace = true
zeroize.workspace = true
openssl = { workspace = true, optional = true }
# Optional: only for the testkit feature.
http-body-util = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
webauthn-authenticator-rs = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
# Enables the testkit feature for this crate's own integration tests.
coffer-server = { workspace = true, features = ["testkit"] }

[build-dependencies]
blake3.workspace = true

[lints]
workspace = true
