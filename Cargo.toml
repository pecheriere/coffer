[workspace]
resolver = "3"
members = ["crates/domain", "crates/store", "crates/server"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pecheriere/coffer"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
# Internal crates
coffer-domain = { path = "crates/domain", version = "0.1.0" }
coffer-store = { path = "crates/store", version = "0.1.0" }
coffer-server = { path = "crates/server", version = "0.1.0" }

# Async runtime and web
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = "0.8.9"
# OpenAPI document generated from the handlers and their types.
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "uuid", "jiff_0_2"] }
utoipa-axum = "0.3.0"
# Query string parsing for the typed API extractors (both already in the tree
# through axum).
serde_urlencoded = "0.7.1"
serde_path_to_error = "0.1.20"

# Storage
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# Auth and crypto
webauthn-rs = "=0.5.5"
# Direct dependency only to turn on its `vendored` feature (webauthn-rs links it).
openssl = "0.10.81"
blake3 = "1.8"
getrandom = "0.4.3"
secrecy = "0.10.3"
zeroize = "1.9.1"
# Provider credential sealing (crates/server/src/vault.rs). Nonces come from
# getrandom directly, so the default `getrandom` feature is off; `alloc` gives
# the Vec-returning encrypt/decrypt and `zeroize` wipes the cipher state on drop.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23.1"
subtle = "2.6.1"
http = "1.4"
# Safe access to umask(2); already in the tree through tempfile.
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process"] }
url = "2.5.8"
# Outbound HTTPS (crates/server/src/egress.rs). rustls with the ring provider
# and the platform verifier; reqwest gets a preconfigured rustls client, so
# aws-lc-rs is never built, and no default feature (system proxy, HTTP/2,
# charset) is enabled.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"

# HTML and CLI
maud = { version = "0.27.0", features = ["axum"] }
clap = { version = "4.6.7", features = ["derive"] }

# Domain, serialization, errors, logging
uuid = { version = "1", features = ["v7", "serde"] }
# The time zone database is built in (`tzdb-bundle-always`): the container
# image has no /usr/share/zoneinfo.
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Test-only
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.3"
proptest = { version = "1", default-features = false, features = ["std"] }
