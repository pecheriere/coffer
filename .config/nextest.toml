# A hung test fails the run instead of stalling it. Limits are about three
# times the measured time, with a floor of 30 s: the slowest ordinary test takes
# 6 s.
[profile.default]
slow-timeout = { period = "10s", terminate-after = 3 }

# These wait out the store's 15 s busy timeout on purpose, so they get 48 s.
[[profile.default.overrides]]
filter = "test(activity_that_cannot_be_recorded_does_not_fail_the_request) | test(failed_last_used_update_does_not_fail_the_request)"
slow-timeout = { period = "16s", terminate-after = 3 }

# These walk every endpoint for many generated cases. They take about 12 s on an
# idle machine, 30 to 38 s alone at a load of about 30, and exceeded 60 s in a full
# run at that load, so they get 120 s.
[[profile.default.overrides]]
filter = "test(grants::proptests::no_endpoint_leaks)"
slow-timeout = { period = "40s", terminate-after = 3 }

# This compares incremental updates with a full rebuild over generated histories.
# It takes about 8 s on a busy machine and exceeded 30 s when other builds were
# running, so it gets 60 s.
[[profile.default.overrides]]
filter = "test(net_worth::rebuild::incremental_matches_a_full_rebuild)"
slow-timeout = { period = "20s", terminate-after = 3 }

# This builds several pairs of worlds to compare byte for byte. It took 8 to 11 s alone
# at a load of about 25 to 29, and exceeded 30 s at a load of about 47, so it gets 60 s.
[[profile.default.overrides]]
filter = "test(grants::bucket_channels::a_hidden_bucket_changes_no_byte)"
slow-timeout = { period = "20s", terminate-after = 3 }
