[graph]
all-features = true
# Scopes the graph to the platforms coffer is built and developed on; every
# advisory, licence and ban still applies to them.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
# Each entry names an advisory with no fix the dependency graph can take yet,
# why coffer is not exposed, and the bead that removes it.
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "Bundled SQLite < 3.54 can return uninitialized memory for a crafted database and -wal pair. The fix (libsqlite3-sys >= 0.39) is blocked: sqlx-sqlite 0.9.0, the latest release, requires < 0.38. coffer opens only its own database at its configured path, so the attack needs write access to the data directory. Removed by bead cof-trx." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0", # webauthn-rs and its companion crates
]

[bans]
# The RustCrypto and rand ecosystems ship overlapping major versions, so
# duplicates are reported but do not fail the build.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
